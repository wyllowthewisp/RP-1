CONTRACT_TYPE
{
	name = SolarSampleReturn
	title = Solar Wind Sample Return
	group = SolarExploration
	agent = Federation Aeronautique Internationale

	description = <b>Program: Solar Exploration<br>Type: <color=green>Required</color></b><br><br>Astronomers have known for years that the Sun's corona emits a steady stream of charged particles, and were able to measure it with early interplanetary spacecraft. Now, they want the chance to study the solar wind directly. Launch a spacecraft with a Solar Wind Concentrator into heliocentric orbit, collect data for at least 1.5 years, and then recover the sample.<br><br><b><color="green">Don't forget to add the main parachute!</color></b><br><br>Historical example: Genesis

	synopsis = Collect a sample of the solar wind and return it to the Earth's surface.

	completedMessage = Well done! Scientists are eager to begin extracting the recovered samples. 

	sortKey = 806

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Sun

	// ************ REWARDS ************
	prestige = Trivial       // 1.0x
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 320 // lunar sample return awards 400, so slightly under that
	failureReputation = 0 // was @rewardReputation

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = SolarExploration
	}

    REQUIREMENT
	{
		name = TechResearched
		type = TechResearched
		tech = sampleReturnScience // this node contains the solar wind sample return experiment part
	}

	// ************ PARAMETERS ************

    PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Solar Wind Sample Return
		define = SolarSampleReturn

	    PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

        PARAMETER
		{
			name = SolarOrbitReachState
			type = ReachState
			targetBody = Sun
			situation = ORBITING
			title = Enter into a heliocentric orbit
			hideChildren = true
		}

        PARAMETER
        {
				name = PartValidation
				type = PartValidation

				VALIDATE
				{
					MODULE
					{
						name = Experiment
						experimentID = RP0solarWindSampler
					}
				}
				title = Craft must carry a Solar Wind Concentrator experiment // placeholder name
        }	

		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return home safely with the science
			hideChildren = true
			completeInSequence = true
		}
	}

    PARAMETER
	{
		name = RP1CollectScience
		type = RP1CollectScience
		targetBody = Sun
		situation = InSpaceHigh
		experiment = RP0solarWindSampler
		fractionComplete = 0.75 // placeholder
		title = Collect a good-quality (75% minimum) sample of the solar wind and return it safely to Earth
	}
}